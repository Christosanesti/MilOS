<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Xenon-accented lock icon for encryption service menu -->
  <defs>
    <linearGradient id="xenonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#50C878;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FFFF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with xenon glow -->
  <circle cx="32" cy="32" r="28" fill="url(#xenonGradient)" opacity="0.3" filter="url(#glow)"/>
  
  <!-- Lock body -->
  <rect x="20" y="28" width="24" height="20" rx="2" fill="#4A90E2" stroke="#00FFFF" stroke-width="1.5"/>
  
  <!-- Lock shackle -->
  <path d="M 26 28 Q 26 20 32 20 Q 38 20 38 28" 
        fill="none" 
        stroke="#00FFFF" 
        stroke-width="2.5" 
        stroke-linecap="round"
        filter="url(#glow)"/>
  
  <!-- Keyhole -->
  <circle cx="32" cy="36" r="3" fill="#FFFFFF"/>
  <rect x="30" y="36" width="4" height="8" fill="#FFFFFF"/>
</svg>

