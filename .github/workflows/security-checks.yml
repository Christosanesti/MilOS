name: Security Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly security scan on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    name: Security & Compliance Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-dbus-dev libpcap-dev libyaml-cpp-dev cmake build-essential

      - name: Install Trivy
        uses: aquasecurity/trivy-action@master
        with:
          trivy_version: 'latest'

      - name: Install Semgrep
        run: |
          python3 -m pip install semgrep --user
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install CycloneDX
        run: |
          CYCLONEDX_VERSION="0.24.2"
          wget -q "https://github.com/CycloneDX/cyclonedx-cli/releases/download/v${CYCLONEDX_VERSION}/cyclonedx-linux-amd64" -O /tmp/cyclonedx
          chmod +x /tmp/cyclonedx
          sudo mv /tmp/cyclonedx /usr/local/bin/cyclonedx

      - name: Build STIG Compliance Checker
        run: |
          cd milos-base/services/stig-compliance-checker
          mkdir -p build && cd build
          cmake ..
          make -j$(nproc)

      - name: Generate SBOM
        run: |
          bash scripts/generate-sbom.sh
        continue-on-error: true

      - name: Run Trivy Vulnerability Scan
        run: |
          bash scripts/trivy-scan.sh
        continue-on-error: true

      - name: Run Semgrep SAST Scan
        run: |
          bash scripts/semgrep-scan.sh
        continue-on-error: true

      - name: Run STIG Compliance Check
        run: |
          cd milos-base/services/stig-compliance-checker/build
          ./milos-stig-checker --all --report json -o stig-compliance-report.json
        continue-on-error: true

      - name: Check Compliance Score
        id: compliance-check
        run: |
          cd milos-base/services/stig-compliance-checker/build
          SCORE=$(./milos-stig-checker --all --json 2>/dev/null | jq -r '.compliance_score' | sed 's/%//' || echo "0")
          echo "score=$SCORE" >> $GITHUB_OUTPUT
          echo "Compliance Score: ${SCORE}%"
          
          # Check for critical failures
          CRITICAL_FAILURES=$(./milos-stig-checker --all --json 2>/dev/null | jq '[.checks[] | select(.severity == "Critical" and .result == "Fail")] | length' || echo "0")
          echo "critical_failures=$CRITICAL_FAILURES" >> $GITHUB_OUTPUT
          
          if [ "$CRITICAL_FAILURES" -gt 0 ]; then
            echo "❌ Critical STIG compliance failures detected"
            exit 1
          fi
          
          # Warn if compliance is below 90%
          if (( $(echo "$SCORE < 90" | bc -l) )); then
            echo "⚠️ Compliance score below 90%"
          else
            echo "✅ Compliance score acceptable"
          fi

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: sbom-reports
          path: |
            sbom/*.json
            sbom/*.xml
          retention-days: 30

      - name: Upload Trivy Reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: trivy-reports
          path: |
            trivy-reports/*.json
            trivy-reports/*.txt
          retention-days: 30

      - name: Upload Semgrep Reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: semgrep-reports
          path: |
            semgrep-reports/*.json
            semgrep-reports/*.txt
          retention-days: 30

      - name: Upload STIG Compliance Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: stig-compliance-report
          path: |
            milos-base/services/stig-compliance-checker/build/stig-compliance-report.json
          retention-days: 30

      - name: Security Summary
        if: always()
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### STIG Compliance" >> $GITHUB_STEP_SUMMARY
          echo "- **Score:** ${{ steps.compliance-check.outputs.score }}%" >> $GITHUB_STEP_SUMMARY
          echo "- **Critical Failures:** ${{ steps.compliance-check.outputs.critical_failures }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Reports Generated" >> $GITHUB_STEP_SUMMARY
          echo "- SBOM: Available in artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Trivy: Available in artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Semgrep: Available in artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- STIG: Available in artifacts" >> $GITHUB_STEP_SUMMARY

