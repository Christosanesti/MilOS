name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MilOS Services
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      matrix:
        service:
          - data-guard
          - audit-service
          - stig-compliance-checker
          - air-gap-deployment-manager

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-dbus-dev libpcap-dev libyaml-cpp-dev cmake build-essential

      - name: Build ${{ matrix.service }}
        run: |
          cd milos-base/services/${{ matrix.service }}
          mkdir -p build && cd build
          cmake ..
          make -j$(nproc)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: ${{ matrix.service }}-build
          path: |
            milos-base/services/${{ matrix.service }}/build/*
          retention-days: 7

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-dbus-dev libpcap-dev libyaml-cpp-dev cmake build-essential

      - name: Run STIG Audit Logging Test
        run: |
          bash scripts/test-stig-audit-logging.sh

      - name: Run Debug Removal Verification
        run: |
          bash scripts/verify-debug-removal.sh
        continue-on-error: true

      - name: Run Unit Tests with Coverage
        run: |
          cd tests
          mkdir -p build && cd build
          cmake -DENABLE_COVERAGE=ON ..
          make
          ctest --output-on-failure
          make coverage || true
        continue-on-error: true

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: coverage-report
          path: |
            tests/build/coverage/
          retention-days: 30

      - name: Upload Test Reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-reports
          path: |
            test-reports/*.txt
          retention-days: 30

